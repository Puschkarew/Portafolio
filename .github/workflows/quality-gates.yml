name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.flags.outputs.run_smoke }}
      contract_changed: ${{ steps.flags.outputs.contract_changed }}
      changelog_changed: ${{ steps.flags.outputs.changelog_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          else
            BASE="$(git rev-parse HEAD~1)"
            HEAD="${{ github.sha }}"
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq '^(docs/figma-audit/(user-tasks\.md|build-dod\.md|components-checklist\.md|layout-rules\.md|hardcodes-map\.md|parity-backlog\.md)|portfolio_figma-to-html_plan_578edebf\.plan\.md)$'; then
            echo "contract_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -Eq '^docs/figma-audit/changelog\.md$'; then
            echo "changelog_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -Eq '^(\.github/workflows/|eleventy\.config\.cjs|src/|styles/|select-icons/|tests/|scripts/|playwright\.config\.ts|package\.json|package-lock\.json|docs/figma-audit/build-dod\.md|docs/figma-audit/changelog\.md|docs/figma-audit/user-tasks\.md|docs/figma-audit/components-checklist\.md|docs/figma-audit/layout-rules\.md|docs/figma-audit/hardcodes-map\.md|docs/figma-audit/parity-backlog\.md)$'; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          fi

  contract_integrity:
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
      - uses: actions/checkout@v4
      - name: Enforce changelog update for contract changes
        shell: bash
        run: |
          if [ "${{ needs.detect_changes.outputs.contract_changed }}" = "true" ] && [ "${{ needs.detect_changes.outputs.changelog_changed }}" != "true" ]; then
            echo "Contract docs changed but docs/figma-audit/changelog.md was not updated."
            exit 1
          fi
      - name: Validate waiver schema if waiver entry exists
        run: node scripts/quality/validate-waivers.mjs

  smoke:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.run_smoke == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium firefox --with-deps
      - name: Run smoke suite
        env:
          PLAYWRIGHT_PROJECTS: chromium,firefox
        run: npm run smoke
      - name: Live parity reminder (local gate)
        run: |
          echo "Reminder: run npm run verify:slice locally (with LIVE_PARITY_SLICE) before closing each vertical slice."

  lightweight:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.run_smoke != 'true'
    steps:
      - run: echo "No smoke-relevant changes detected. Contract integrity checks still passed."

  quality_passed:
    runs-on: ubuntu-latest
    needs: [detect_changes, contract_integrity, smoke, lightweight]
    if: always()
    steps:
      - name: Confirm required gates passed
        env:
          CONTRACT_RESULT: ${{ needs.contract_integrity.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight.result }}
          RUN_SMOKE: ${{ needs.detect_changes.outputs.run_smoke }}
        shell: bash
        run: |
          if [ "$CONTRACT_RESULT" != "success" ]; then
            echo "contract_integrity did not pass: $CONTRACT_RESULT"
            exit 1
          fi

          if [ "$RUN_SMOKE" = "true" ]; then
            if [ "$SMOKE_RESULT" != "success" ]; then
              echo "smoke did not pass: $SMOKE_RESULT"
              exit 1
            fi
          else
            if [ "$LIGHTWEIGHT_RESULT" != "success" ]; then
              echo "lightweight did not pass: $LIGHTWEIGHT_RESULT"
              exit 1
            fi
          fi

  build_pages:
    runs-on: ubuntu-latest
    needs: quality_passed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          SITE_BUILD_AT: ${{ github.event.head_commit.timestamp }}
        run: npm run build-ghpages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy_pages:
    runs-on: ubuntu-latest
    needs: build_pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
